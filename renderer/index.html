<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; script-src 'self';">
  <title>Cuando Juega</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Custom Titlebar -->
  <div class="titlebar" id="titlebar">
    <div class="titlebar-title">cuando juega</div>
    <div class="titlebar-controls">
      <button class="titlebar-btn minimize-btn" id="minimizeBtn" title="Minimizar">&#x2500;</button>
      <button class="titlebar-btn close-btn" id="closeBtn" title="Cerrar">&#x2715;</button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">
    <!-- Search Section -->
    <div class="search-section">
      <div class="search-row">
        <div class="select-wrapper">
          <select id="teamSelect" class="team-select">
            <option value="">Selecciona un equipo...</option>
          </select>
        </div>
        <button id="searchBtn" class="search-btn">Buscar</button>
      </div>
    </div>

    <!-- Loading State -->
    <div class="loading-state" id="loadingState">
      <div class="loading-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <p class="loading-text">Buscando partidos...</p>
    </div>

    <!-- Error State -->
    <div class="error-state" id="errorState">
      <p class="error-message" id="errorMessage">No se encontraron partidos.</p>
      <button class="retry-btn" id="retryBtnError">Reintentar</button>
    </div>

    <!-- Results -->
    <div class="results-container" id="resultsContainer"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
