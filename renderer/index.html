<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self' data: https://*.espncdn.com;">
  <title>¿Cuándo Juega?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Custom Titlebar -->
  <div class="titlebar" id="titlebar">
    <div class="titlebar-title">
      <svg class="title-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
        <path d="M12 2C12 2 14.5 6 14.5 12C14.5 18 12 22 12 22" stroke="currentColor" stroke-width="1.5"/>
        <path d="M12 2C12 2 9.5 6 9.5 12C9.5 18 12 22 12 22" stroke="currentColor" stroke-width="1.5"/>
        <line x1="2.5" y1="9" x2="21.5" y2="9" stroke="currentColor" stroke-width="1.5"/>
        <line x1="2.5" y1="15" x2="21.5" y2="15" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      ¿CUÁNDO JUEGA?
    </div>
    <div class="titlebar-controls">
      <button class="titlebar-btn minimize-btn" id="minimizeBtn" title="Minimizar">─</button>
      <button class="titlebar-btn close-btn" id="closeBtn" title="Cerrar">✕</button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">
    <!-- Search Section -->
    <div class="search-section">
      <label class="search-label" for="teamInput">ELEGÍ TU EQUIPO</label>
      <div class="search-row">
        <div class="input-wrapper">
          <input type="text" id="teamInput" class="team-input" placeholder="Escribí un equipo..." autocomplete="off" spellcheck="false">
          <ul class="suggestions-list" id="suggestionsList"></ul>
        </div>
        <button id="searchBtn" class="search-btn">¿CUÁNDO JUEGA?</button>
      </div>
    </div>

    <!-- Loading State -->
    <div class="loading-state" id="loadingState">
      <div class="loading-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <p class="loading-text">BUSCANDO PRÓXIMOS PARTIDOS...</p>
    </div>

    <!-- Error State: Team Not Found -->
    <div class="error-state" id="errorNotFound">
      <svg class="error-svg" width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="20" stroke="#8a8578" stroke-width="2" stroke-dasharray="4 4"/>
        <path d="M20 20L28 28M28 20L20 28" stroke="#8a8578" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <p class="error-title">EQUIPO NO ENCONTRADO</p>
      <p class="error-detail" id="errorNotFoundMsg">Revisá el nombre e intentá de nuevo.</p>
    </div>

    <!-- Error State: No Matches -->
    <div class="error-state" id="errorNoMatches">
      <svg class="error-svg" width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="8" y="12" width="32" height="28" rx="3" stroke="#8a8578" stroke-width="2"/>
        <line x1="8" y1="20" x2="40" y2="20" stroke="#8a8578" stroke-width="2"/>
        <line x1="16" y1="8" x2="16" y2="14" stroke="#8a8578" stroke-width="2" stroke-linecap="round"/>
        <line x1="32" y1="8" x2="32" y2="14" stroke="#8a8578" stroke-width="2" stroke-linecap="round"/>
        <path d="M20 30H28" stroke="#8a8578" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <p class="error-title">SIN PARTIDOS PROGRAMADOS</p>
      <p class="error-detail" id="errorNoMatchesMsg">No hay próximos partidos agendados por el momento.</p>
    </div>

    <!-- Error State: Network/Generic -->
    <div class="error-state" id="errorNetwork">
      <svg class="error-svg" width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 24C8 24 14 14 24 14C34 14 40 24 40 24" stroke="#8a8578" stroke-width="2" stroke-linecap="round"/>
        <path d="M14 28C14 28 18 22 24 22C30 22 34 28 34 28" stroke="#8a8578" stroke-width="2" stroke-linecap="round"/>
        <circle cx="24" cy="34" r="2.5" fill="#8a8578"/>
        <line x1="10" y1="38" x2="38" y2="10" stroke="#f5e642" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <p class="error-title">SIN CONEXIÓN</p>
      <p class="error-detail" id="errorNetworkMsg">Verificá tu conexión a internet e intentá de nuevo.</p>
      <button class="retry-btn" id="retryBtnError">REINTENTAR</button>
    </div>

    <!-- Results Container (multiple cards) -->
    <div class="results-container" id="resultsContainer"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
